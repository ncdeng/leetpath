# leetpath：nginx 静态 + /api 反代、FastAPI、判题 worker。
# 判题镜像不随 up 启动，需先：docker compose build judge-python judge-cpp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: leetpath-backend:${LEETPATH_VERSION:-latest}
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    user: "10001"
    # required: false：无 .env 时仍可 `compose config`。生产必须自行填写 .env。
    env_file:
      - path: ${LEETPATH_ENV_FILE:-.env}
        required: false
    environment:
      APP_VERSION: ${LEETPATH_VERSION:-dev}
    volumes:
      - leetpath-data:/app/data
    expose:
      - "8000"
    networks:
      - app
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  judge:
    image: leetpath-backend:${LEETPATH_VERSION:-latest}
    build:
      context: ./backend
    command: ["python", "-m", "judge.worker"]
    # 与 backend/backup 同 uid：SQLite WAL 辅助文件属主必须一致，否则跨进程写库会失败
    user: "10001"
    group_add:
      - "${DOCKER_GID:-999}"
    env_file:
      - path: ${LEETPATH_ENV_FILE:-.env}
        required: false
    environment:
      TMPDIR: /var/lib/leetpath/judge-tmp
    volumes:
      - leetpath-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      # worker 在 /var/lib/leetpath/judge-tmp 写用例后 docker -v 走宿主路径，需与容器内绝对路径一致
      - /var/lib/leetpath/judge-tmp:/var/lib/leetpath/judge-tmp
    networks:
      - app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  backup:
    image: leetpath-backend:${LEETPATH_VERSION:-latest}
    build:
      context: ./backend
    command: ["python", "-m", "app.backup"]
    user: "10001"
    env_file:
      - path: ${LEETPATH_ENV_FILE:-.env}
        required: false
    volumes:
      - leetpath-data:/app/data:ro
      - leetpath-backups:/app/backups
    networks:
      - app
    profiles: ["production"]
    depends_on:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  judge-python:
    image: leetpath-judge-python
    build:
      context: ./backend/judge
      dockerfile: Dockerfile.python
    profiles: ["judge-images"]
    command: ["true"]
    restart: "no"

  judge-cpp:
    image: leetpath-judge-cpp
    build:
      context: ./backend/judge
      dockerfile: Dockerfile.cpp
    profiles: ["judge-images"]
    command: ["true"]
    restart: "no"

  frontend:
    image: leetpath-frontend:${LEETPATH_VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        LEETPATH_VERSION: ${LEETPATH_VERSION:-dev}
    expose:
      - "80"
    networks:
      - edge
      - app
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    profiles: ["production"]
    networks:
      - edge
    depends_on:
      - frontend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

volumes:
  leetpath-data:
  leetpath-backups:

networks:
  edge:
  egress:
  app:
    internal: true
